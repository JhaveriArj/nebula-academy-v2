name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  javac:
    name: real javac gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # Proves every starter.java and solution.java is genuinely valid Java that
      # compiles against the real FTC package names, so a kid's code pastes into
      # Android Studio unchanged. See docs/ARCHITECTURE.md.
      - run: npm run verify:javac
