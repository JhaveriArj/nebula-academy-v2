<!doctype html>
<html lang="en" data-mode="builder">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nebula Academy — learn FTC robot programming in Java</title>
    <meta name="description" content="Write real Java. A virtual robot drives. Then put your code on your team's bot. Six tiers, 42 lessons, ages 9 to 18." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F3FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100E3E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./art/icons/favicon.svg" type="image/svg+xml" />
    <!-- The home hero's mascot is the LCP element, but the app builds the page in JS, so the
         browser cannot see the image until the script has run. Preloading lets it download
         alongside the script. 25 KB, so the cost on other routes is small. -->
    <link rel="preload" as="image" href="./art/mascot-560.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lexend:wght@400..600&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the main content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
