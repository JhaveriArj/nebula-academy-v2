<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Tank drivetrain robot, seen from above">
  <!-- Anchor: the centre of the 100x100 box is the robot's centre of rotation.
       Forward is towards -y (up). Footprint is 18 in square. -->
  <g fill="none" stroke="#DCE0D8" stroke-width="3" stroke-linejoin="miter">
    <rect x="12" y="8" width="76" height="84" fill="#1B2736"/>
    <!-- Two wheels, centred on the long sides. -->
    <rect x="2" y="32" width="14" height="36" fill="#0E1620" stroke="#8A93A0" stroke-width="2.5"/>
    <rect x="84" y="32" width="14" height="36" fill="#0E1620" stroke="#8A93A0" stroke-width="2.5"/>
    <!-- Bodywork. -->
    <path d="M24 26 H76" stroke="#46566B" stroke-width="2"/>
    <path d="M24 74 H76" stroke="#46566B" stroke-width="2"/>
  </g>
  <!-- Forward marker. Amber, because this sprite only ever sits on the dark field. -->
  <g stroke="#F0A93B" stroke-width="3.5" stroke-linecap="square">
    <path d="M50 38 V6"/>
  </g>
  <circle cx="50" cy="4" r="4.5" fill="#F0A93B"/>
</svg>
